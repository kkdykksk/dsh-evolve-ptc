<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="Evolve PTC: three ascending chevrons feed a closed observe-act-verify loop with a ledger and a guard">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#131C33"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5B252"/>
      <stop offset="1" stop-color="#E87A4A"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7AD0EC"/>
      <stop offset="1" stop-color="#6EA0F4"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9680FC"/>
      <stop offset="1" stop-color="#C478F6"/>
    </linearGradient>
  </defs>

  <rect width="640" height="300" rx="24" fill="url(#bg)"/>
  <g fill="#8FA6C8" opacity="0.16">
    <circle cx="40" cy="40" r="1.6"/><circle cx="600" cy="40" r="1.6"/>
    <circle cx="40" cy="260" r="1.6"/><circle cx="600" cy="260" r="1.6"/>
    <circle cx="320" cy="40" r="1.6"/><circle cx="320" cy="260" r="1.6"/>
  </g>

  <!-- three ascending chevrons: the mode stack (ptc -> deep-ptc -> evolve-ptc) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="11">
    <path d="M66 214 L126 168 L186 214" stroke="url(#amber)"/>
    <path d="M80 168 L126 132 L172 168" stroke="url(#cyan)"/>
    <path d="M96 126 L126 100 L156 126" stroke="url(#violet)"/>
  </g>
  <circle cx="126" cy="84" r="6" fill="#EBF6FF"/>

  <!-- observe -> act -> verify loop -->
  <g transform="translate(392 150)">
    <circle r="78" fill="none" stroke="#243557" stroke-width="12"/>
    <path d="M0 -78 A78 78 0 0 1 67 39" fill="none" stroke="url(#cyan)" stroke-width="6" stroke-linecap="round"/>
    <path d="M50 -52 A78 78 0 0 1 78 0" fill="none" stroke="#35E0F5" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
    <path d="M78 0 L64 -16 L92 -16 Z" fill="#35E0F5" opacity="0.9"/>
    <path d="M-26 4 L-6 24 L34 -18" fill="none" stroke="#9FF3D2" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="0" cy="-34" r="7" fill="#35E0F5"/>
    <circle cx="52" cy="52" r="7" fill="#9680FC"/>
    <circle cx="-52" cy="52" r="7" fill="#F5B252"/>
  </g>

  <!-- ledger: three recorded lines -->
  <g transform="translate(228 236)">
    <rect x="0" y="0" width="92" height="8" rx="4" fill="#31456E"/>
    <rect x="0" y="16" width="68" height="8" rx="4" fill="#2A3C60"/>
    <rect x="0" y="32" width="80" height="8" rx="4" fill="#24345A"/>
  </g>

  <!-- guard: a shield with a slash, meaning "blocked until you reflect" -->
  <g transform="translate(556 232)">
    <path d="M0 -15 L13 -9 V1 C13 9 7 15 0 18 C-7 15 -13 9 -13 1 V-9 Z" fill="none" stroke="#E87A4A" stroke-width="1.6" opacity="0.85"/>
    <path d="M-6 -3 L6 9 M6 -3 L-6 9" stroke="#E87A4A" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>
  </g>
</svg>
